<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfcff" />
    <meta name="description" content="Небольшое приглашение на прогулку." />
    <title>Пойдём гулять?</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f4f7ff'/%3E%3Cpath d='M10 10l4 12M21 9l-3 14' stroke='%236179b9' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <main class="experience" id="experience">
      <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

      <h1 class="question" id="question" aria-live="polite">Пойдем гулять?)</h1>

      <div class="actions" id="actions" aria-label="Ответ">
        <button class="answer answer--yes" id="yesButton" type="button">Да</button>
        <button class="answer answer--no" id="noButton" type="button">Нет</button>
      </div>
    </main>

    <script src="./scripts/app.js" defer></script>
  </body>
</html>
